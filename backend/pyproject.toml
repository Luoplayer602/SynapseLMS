[project]
name = "synapselms-api"
version = "0.1.0"
description = "SynapseLMS FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]>=0.124,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "PyJWT>=2.10,<3.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
